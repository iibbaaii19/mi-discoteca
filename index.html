<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17131D">
<meta name="description" content="Tu reproductor de música personal.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Discoteca">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mi Discoteca</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: biblioteca a la izquierda, escenario central con portadas grandes, reproductor abajo y pantalla completa "Sonando" */
:root{
  --bg:#F1EFF4; --surface:#FFFFFF; --surface-2:#E7E3ED; --fg:#1C1924; --muted:#686274;
  --line:#DCD7E3; --accent:#C2501A; --accent-fg:#FFFFFF; --accent-soft:#F5DFD2;
  --stage:#17131D; --stage-fg:#FFFFFF; --stage-muted:rgba(255,255,255,.72);
  --dyn:194 80 26;
  --shadow:0 14px 36px rgba(28,25,36,.18);
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121017; --surface:#1B1822; --surface-2:#262130; --fg:#EEEAF3; --muted:#9C95AA;
  --line:#2E2939; --accent:#F08A47; --accent-fg:#1A0E06; --accent-soft:#3B2417;
  --shadow:0 14px 36px rgba(0,0,0,.55); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121017; --surface:#1B1822; --surface-2:#262130; --fg:#EEEAF3; --muted:#9C95AA;
  --line:#2E2939; --accent:#F08A47; --accent-fg:#1A0E06; --accent-soft:#3B2417;
  --shadow:0 14px 36px rgba(0,0,0,.55); color-scheme:dark;}

html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;display:block;flex:none}
img{max-width:100%}

.app{height:100%;display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}

/* Lateral */
.side{grid-row:1;display:flex;flex-direction:column;gap:20px;padding:22px 16px 16px max(20px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);min-height:0;overflow:auto}
.brand{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.disc{width:26px;height:26px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--bg) 0 16%,rgb(var(--dyn)) 17% 33%,#1b1720 34% 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.06)}
body.playing .brand .disc{animation:spin 2.4s linear infinite}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden}
.nav-btn span:not(.cnt){overflow:hidden;text-overflow:ellipsis}
.nav-btn:hover{color:var(--fg);background:var(--surface-2)}
.nav-btn[aria-current="true"]{color:var(--fg);background:var(--surface)}
.nav-btn .cnt{margin-left:auto;font-family:var(--font-mono);font-size:12px;font-weight:400;color:var(--muted)}
.nav-h{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px;padding:0 10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.nav-h button{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.nav-h button:hover{background:var(--surface-2);color:var(--fg)}
.pl-form{display:flex;gap:6px;padding:4px 4px 6px}
.pl-form input{flex:1;min-width:0;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.pl-form button{padding:0 10px;border-radius:8px;background:var(--fg);color:var(--bg);font-weight:600;font-size:13px}
.side-add{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:999px;font-weight:700;cursor:pointer;white-space:nowrap;user-select:none}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border:1px solid var(--line);color:var(--fg)}
.btn.ghost:hover{background:var(--surface-2)}
.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.note{margin:2px 4px 0;font-size:12px;color:var(--muted)}

/* Principal */
.main{grid-row:1;min-width:0;min-height:0;overflow:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 28px 28px;position:relative}
.main::before{content:"";position:absolute;inset:0 0 auto 0;height:380px;background:linear-gradient(180deg,rgb(var(--dyn) / .30),transparent);pointer-events:none;transition:background .8s}
.main > *{position:relative}
.topbar{position:sticky;top:0;z-index:5;padding:16px 0 12px;display:flex;gap:12px;align-items:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg)}
.search:focus-within{border-color:var(--accent)}

.demo-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-radius:12px;background:var(--accent-soft);margin:4px 0 18px}
.demo-bar p{margin:0;flex:1;min-width:220px}
.demo-bar button{font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* Portadas */
.cv{display:block;overflow:hidden;flex:none;background:var(--surface-2);position:relative}
.cv img{width:100%;height:100%;object-fit:cover;display:block}

/* Inicio: escenario */
.hero{position:relative;overflow:hidden;border-radius:20px;background:var(--stage);color:var(--stage-fg);display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:end;padding:28px;margin:6px 0 34px;min-height:260px}
.hero-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.3);opacity:.6;transform:scale(1.1);transition:background-image .6s}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,11,18,.55),rgba(14,11,18,.15) 60%,rgba(14,11,18,.45))}
.hero > *:not(.hero-bg){position:relative;z-index:1}
.hero .art{position:relative;width:204px;height:204px}
.hero .art .cv{width:100%;height:100%;border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.45);z-index:2}
.hero .art .vinyl{position:absolute;top:6%;left:34%;width:88%;height:88%;z-index:1}
.hero-txt{min-width:0}
.hero .eyebrow{color:var(--stage-muted)}
.hero h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(34px,5.4vw,64px);line-height:.98;letter-spacing:-.035em;text-wrap:balance;overflow-wrap:anywhere}
.hero .by{margin:10px 0 18px;color:var(--stage-muted);font-size:16px}
.hero-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero .btn.light{background:#fff;color:#16121b}
.hero .btn.outline{border:1px solid rgba(255,255,255,.4);color:#fff}
.hero canvas.viz{position:absolute;right:0;bottom:0;width:46%;height:110px;z-index:0;opacity:.85;pointer-events:none}

.vinyl{border-radius:50%;background:
  radial-gradient(circle,rgb(var(--dyn)) 0 14%,#0c0a0f 14.5% 16%,transparent 16.5%),
  repeating-radial-gradient(circle,#18151c 0 2px,#100e13 2px 4px);
  box-shadow:0 10px 30px rgba(0,0,0,.5);animation:spin 3.2s linear infinite;animation-play-state:paused}
body.playing .vinyl{animation-play-state:running}
@keyframes spin{to{transform:rotate(1turn)}}

.sec{margin:0 0 34px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px}
.sec-h h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.02em}
.sec-h button{color:var(--muted);font-weight:700;font-size:13px}
.sec-h button:hover{color:var(--fg)}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(150px,18vw,200px);gap:18px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.shelf > *{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px 18px}

.card{text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;padding:10px;border-radius:14px;position:relative}
.card:hover{background:var(--surface)}
.card .cvw{position:relative;width:100%;aspect-ratio:1;max-width:100%}
.card .cv{width:100%;height:100%;border-radius:10px;box-shadow:var(--shadow);transition:transform .25s}
.card:hover .cv{transform:translateY(-3px)}
.card .fab{position:absolute;right:10px;bottom:10px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,0,0,.35);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
.card:hover .fab,.card:focus-within .fab{opacity:1;transform:none}
@media (hover:none){.card .fab{opacity:1;transform:none}}
.card b,.card small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card b{font-weight:700}
.card small{color:var(--muted);font-size:13px;margin-top:-6px}
.mosaic{display:grid;grid-template-columns:1fr 1fr;width:100%;height:100%;border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.mosaic .cv{border-radius:0;box-shadow:none;width:100%;height:100%}
.card:hover .mosaic .cv{transform:none}

/* Encabezado de vista */
.vh{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:12px 0 24px}
.vh .cv,.vh .mosaic{width:200px;height:200px;border-radius:12px;box-shadow:var(--shadow)}
.vh-text{min-width:0;flex:1}
.eyebrow{margin:0 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.vh h1,.vh .pl-title{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(32px,5.4vw,60px);line-height:1.02;letter-spacing:-.03em;text-wrap:balance;overflow-wrap:anywhere}
.pl-title{border:0;background:none;width:100%;padding:0;border-radius:6px;outline:none}
.pl-title:focus{background:var(--surface)}
.meta{margin:8px 0 0;color:var(--muted);font-size:14px}
.vh-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.round{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:0 8px 20px rgb(var(--dyn) / .35)}
.round .ic{width:24px;height:24px}
.round:hover{transform:scale(1.05)}
.danger-link{color:var(--muted);font-size:13px;font-weight:600;padding:8px 10px;border-radius:8px}
.danger-link:hover{background:var(--surface-2);color:var(--fg)}
.danger-link.armed{color:#fff;background:#B3261E}

/* Filas */
.list{display:flex;flex-direction:column}
.lh,.row{display:grid;grid-template-columns:34px minmax(0,1.6fr) minmax(0,1fr) 64px 36px;align-items:center;gap:12px;padding:0 8px}
.lh{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px}
.lh .du,.row .du{text-align:right}
.row{min-height:60px;border-radius:10px;cursor:pointer}
.row:hover{background:var(--surface)}
.row .n{font-family:var(--font-mono);font-size:13px;color:var(--muted);text-align:center}
.row .t{display:flex;align-items:center;gap:12px;min-width:0}
.row .cv{width:44px;height:44px;border-radius:6px}
.tt{min-width:0;display:flex;flex-direction:column}
.tt b,.tt small,.row .al{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt b{font-weight:600}
.tt small{color:var(--muted);font-size:13px}
.row .al{color:var(--muted);font-size:14px}
.row .du{font-family:var(--font-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row.on{background:rgb(var(--dyn) / .12)}
.row.on .tt b{color:var(--accent)}
.more{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);opacity:0}
.row:hover .more,.row:focus-within .more,.more:focus-visible{opacity:1}
@media (hover:none){.more{opacity:1}}
.more:hover{background:var(--surface-2);color:var(--fg)}

.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--accent);border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
body:not(.playing) .eq i{animation-play-state:paused}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:56px 20px;border:2px dashed var(--line);border-radius:16px;margin-top:8px}
.empty h2{margin:0;font-family:var(--font-display);font-size:26px;letter-spacing:-.02em}
.empty p{margin:0;color:var(--muted);max-width:44ch}
.empty .row-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* Reproductor */
.player{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:16px;position:relative;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
.player::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgb(var(--dyn) / .18),transparent 55%);pointer-events:none}
.player > *{position:relative}
.now{display:flex;align-items:center;gap:12px;min-width:0;text-align:left;border-radius:10px;padding:2px}
.now .cv{width:56px;height:56px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.now .tt b{font-size:14px}
.now:hover .tt b{text-decoration:underline;text-underline-offset:3px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ctl-btns{display:flex;align-items:center;gap:18px}
.cb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);position:relative}
.cb:hover{color:var(--fg)}
.cb.active{color:var(--accent)}
.cb.active::after{content:"";position:absolute;bottom:0;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.cb .one{position:absolute;top:3px;right:2px;font-size:9px;font-weight:800;font-family:var(--font-mono)}
.pp{width:44px;height:44px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.pp:hover{transform:scale(1.05)}
.pp:disabled{opacity:.4;cursor:default;transform:none}
.seek{display:flex;align-items:center;gap:10px;width:100%}
.seek span{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:38px}
.seek span:first-child{text-align:right}
.right{display:flex;align-items:center;justify-content:flex-end;gap:8px;color:var(--muted)}
.right input{width:min(110px,100%)}

input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:16px;background:transparent;cursor:pointer;--p:0%;--tr:var(--line);--fi:var(--fg)}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--fi) var(--p),var(--tr) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--fi) var(--p),var(--tr) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--fi);margin-top:-4px;border:0}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--fi);border:0}
input[type=range]:hover{--fi:var(--accent)}

/* Pantalla "Sonando" */
.np{position:fixed;inset:0;z-index:20;background:var(--stage);color:var(--stage-fg);overflow:hidden;display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.np-bg{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(70px) saturate(1.4);opacity:.7;transform:scale(1.15)}
.np::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,transparent,rgba(10,8,13,.7) 75%)}
.np > *:not(.np-bg){position:relative;z-index:1}
.np-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.np-top p{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--stage-muted);text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;flex:none}
.np-x:hover{background:rgba(255,255,255,.22)}
.np-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:center;max-width:1180px;width:100%;margin:0 auto;padding:12px 0}
.np-art{position:relative;width:min(100%,52vh,520px);aspect-ratio:1;justify-self:center;margin-right:16%}
.np-art .cv{width:100%;height:100%;border-radius:14px;box-shadow:0 30px 70px rgba(0,0,0,.55);z-index:2}
.np-art .vinyl{position:absolute;top:4%;left:28%;width:92%;height:92%;z-index:1;transition:left .6s cubic-bezier(.2,.8,.2,1)}
body:not(.playing) .np-art .vinyl{left:12%}
.np-info{min-width:0;display:flex;flex-direction:column;gap:18px}
.np-info h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(30px,4.6vw,58px);line-height:1;letter-spacing:-.035em;text-wrap:balance;overflow-wrap:anywhere}
.np-info .by{margin:-6px 0 0;font-size:18px;color:var(--stage-muted)}
.np .seek span{color:var(--stage-muted)}
.np input[type=range]{--tr:rgba(255,255,255,.25);--fi:#fff}
.np input[type=range]:hover{--fi:rgb(var(--dyn))}
.np-ctl{display:flex;align-items:center;gap:22px}
.np .cb{color:rgba(255,255,255,.75);width:44px;height:44px}
.np .cb:hover{color:#fff}
.np .cb.active{color:#fff}
.np .cb .ic{width:24px;height:24px}
.np .pp{width:68px;height:68px;background:#fff;color:#16121b}
.np .pp .ic{width:30px;height:30px}
.upnext{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.upnext h3{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--stage-muted)}
.upnext button{display:flex;align-items:center;gap:12px;text-align:left;padding:6px;border-radius:8px;min-width:0}
.upnext button:hover{background:rgba(255,255,255,.1)}
.upnext .cv{width:40px;height:40px;border-radius:5px}
.upnext .tt small{color:var(--stage-muted)}
.np canvas.viz{position:absolute;left:0;right:0;bottom:0;width:100%;height:150px;z-index:0;pointer-events:none;opacity:.55}

/* Menú, aviso y zona de soltar */
.menu{position:fixed;z-index:30;min-width:230px;max-width:calc(100vw - 32px);max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu button:hover{background:var(--surface-2)}

function compose(chords, bpm, seconds, bright){
  const rate = 22050, N = Math.floor(seconds*rate), out = new Float32Array(N), f = m => 440*Math.pow(2, (m-69)/12);
  const note = (start, dur, m, amp, decay, harm) => { const s0 = Math.floor(start*rate), len = Math.min(Math.floor(dur*rate), N - s0), fr = f(m);
    for(let i = 0; i < len; i++){ const t = i/rate, env = Math.min(1, t*120)*Math.exp(-t*decay), ph = 2*Math.PI*fr*t;
      out[s0+i] += amp*env*(Math.sin(ph) + harm*Math.sin(2*ph) + harm*0.4*Math.sin(3*ph)); } };
  const step = 60/bpm/2, barLen = step*8, pat = [0,1,2,3,2,1,3,2];
  for(let t0 = 0, bar = 0; t0 < seconds - 0.2; t0 += barLen, bar++){
    const ch = chords[bar % chords.length];
    note(t0, barLen, ch[0]-12, 0.22, 1.6, 0.25); note(t0 + step*4, barLen/2, ch[0]-12, 0.16, 2.2, 0.25);
    for(const m of ch) note(t0, barLen, m, 0.045, 0.5, 0.1);
    for(let k = 0; k < 8; k++) note(t0 + k*step, step*3, ch[pat[k] % ch.length] + 12, 0.09, 5, bright);
    for(let k = 0; k < 4; k++) note(t0 + k*step*2, 0.12, 36, 0.25, 30, 0);
  }
  const fade = Math.floor(1.5*rate); for(let i = 0; i < fade; i++) out[N-1-i] *= i/fade;
  return wav(out, rate);
}

/* ---------- Visualizador ---------- */
let actx = null, analyser = null, freq = null;
function ensureAudioGraph(){
  if(actx || IOS) { if(actx && actx.state === 'suspended') actx.resume().catch(()=>{}); return; }
  try { const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    actx = new AC(); const src = actx.createMediaElementSource(audio); analyser = actx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = .8;
    src.connect(analyser); analyser.connect(actx.destination); freq = new Uint8Array(analyser.frequencyBinCount);
  } catch(e){ actx = null; analyser = null; }
}
function sizeCanvases(){ for(const c of $$('canvas.viz')){ const r = c.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); if(r.width){ c.width = r.width*dpr; c.height = r.height*dpr; } } }
let fakeT = 0;
function drawViz(){
  requestAnimationFrame(drawViz);
  const playing = !audio.paused && S.current;
  const targets = $$('canvas.viz').filter(c => c.offsetParent !== null || c.id === 'npViz' && !$('#np').hidden);
  if(!targets.length) return;
  let data;
  if(analyser && playing){ analyser.getByteFrequencyData(freq); data = freq; }
  else { fakeT += playing && !REDUCED ? 0.05 : 0; data = new Array(64).fill(0).map((_,i) => playing ? (90 + 60*Math.sin(fakeT*2 + i*0.45) * Math.sin(fakeT*0.7 + i*0.13)) : 14); }
  const [r,g,b] = getComputedStyle(document.documentElement).getPropertyValue('--dyn').trim().split(/\s+/).map(Number);
  for(const c of targets){
    const x = c.getContext('2d'), W = c.width, H = c.height; x.clearRect(0, 0, W, H);
    const bars = c.id === 'npViz' ? 64 : 40, bw = W/bars;
    for(let i = 0; i < bars; i++){
      const v = (data[Math.floor(i*(data.length*0.72)/bars)] || 0)/255, h = Math.max(2, v*H*0.95);
      const gr = x.createLinearGradient(0, H - h, 0, H); gr.addColorStop(0, `rgba(${r},${g},${b},.95)`); gr.addColorStop(1, `rgba(${r},${g},${b},.15)`);
      x.fillStyle = gr; x.fillRect(i*bw + bw*0.18, H - h, bw*0.64, h);
    }
  }
}

/* ---------- Reproducción ---------- */
function shuffled(a){ a = a.slice(); for(let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function buildQueue(startId){
  let q = S.base.slice();
  if(S.shuffle){ q = shuffled(q.filter(x => x !== startId)); if(startId) q.unshift(startId); }
  S.queue = q; S.qi = startId ? Math.max(0, q.indexOf(startId)) : 0;
}
function playList(ids, startId, from){
  if(!ids.length) return;
  S.base = ids.slice(); S.from = from || '';
  if(!startId && S.shuffle) startId = ids[Math.floor(Math.random()*ids.length)];
  buildQueue(startId || ids[0]); playIndex(S.qi);
}
function playIndex(i){
  const t = byId(S.queue[i]); if(!t) return;
  ensureAudioGraph();
  S.qi = i; S.current = t.id; audio.src = srcUrl(t); audio.play().catch(() => {});
  mediaMeta(t); applyColor(t); renderView(); renderPlayer();
}
function stop(){ audio.pause(); audio.removeAttribute('src'); audio.load(); S.current = null; S.qi = -1; renderPlayer(); }
function next(auto){
  if(!S.queue.length) return;
  if(auto && S.repeat === 'one'){ audio.currentTime = 0; audio.play().catch(()=>{}); return; }
  if(S.qi < S.queue.length - 1) playIndex(S.qi + 1);
  else if(S.repeat !== 'off'){ if(S.shuffle) S.queue = shuffled(S.queue); playIndex(0); }
  else if(auto){ audio.pause(); audio.currentTime = 0; renderPlayer(); }
}
function prev(){ if(audio.currentTime > 3 || S.qi <= 0){ audio.currentTime = 0; return; } playIndex(S.qi - 1); }
function togglePlay(){
  if(!S.current){ const list = viewTracks(); playList((list.length ? list : S.tracks).map(t => t.id)); return; }
  ensureAudioGraph();
  if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
}
function mediaMeta(t){
  if(!('mediaSession' in navigator)) return;
  try { navigator.mediaSession.metadata = new MediaMetadata({title:t.title, artist:t.artist, album:t.album || '', artwork:[{src:coverSrc(t), sizes:'512x512'}]}); } catch(e){}
}
try { if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play', () => audio.play().catch(()=>{}));
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('nexttrack', () => next(false));
  navigator.mediaSession.setActionHandler('previoustrack', prev);
  navigator.mediaSession.setActionHandler('seekto', d => { if(d.seekTime != null) audio.currentTime = d.seekTime; });
} } catch(e){}
audio.addEventListener('play', renderPlayer);
audio.addEventListener('pause', renderPlayer);

  updateTime();
});

  const id = btn.dataset.more, inPl = !!btn.dataset.plCtx; if(!byId(id)) return;
  let h = `<button data-m="next">Reproducir después</button><button data-m="queue">Agregar a la cola</button><div class="sep"></div><div class="lbl">Agregar a playlist</div>`;
  for(const p of S.playlists) if(!(S.view.type === 'playlist' && S.view.id === p.id)) h += `<button data-m="addpl" data-p="${p.id}">${esc(p.name)}</button>`;
  h += `<button data-m="newpl">+ Nueva playlist con esta canción</button><div class="sep"></div>`;
  if(inPl) h += `<button data-m="rmpl">Quitar de esta playlist</button>`;
  h += `<button data-m="del" class="warn">Eliminar de mi discoteca</button>`;
  menu.innerHTML = h; menu.dataset.id = id; menu.hidden = false; S.armed = null;
  const r = btn.getBoundingClientRect(), mw = menu.offsetWidth, mh = menu.offsetHeight;
  let x = r.right - mw, y = r.bottom + 4;
  if(y + mh > innerHeight - 8) y = Math.max(8, r.top - mh - 4);
  x = Math.max(8, Math.min(x, innerWidth - mw - 8));
  menu.style.left = x + 'px'; menu.style.top = y + 'px';
  const first = menu.querySelector('button'); if(first) first.focus();
}
function closeMenu(){ if(!menu.hidden){ menu.hidden = true; S.armed = null; } }
menu.addEventListener('click', async e => {
  const b = e.target.closest('button'); if(!b) return;
  const id = menu.dataset.id, t = byId(id), m = b.dataset.m; if(!t) return closeMenu();
  if(m === 'next'){
    if(!S.current) playList([id]);
    else { const i = S.queue.indexOf(id); if(i > -1 && i !== S.qi){ S.queue.splice(i,1); if(i < S.qi) S.qi--; } if(id !== S.current) S.queue.splice(S.qi+1, 0, id); renderPlayer(); toast('Sonará a continuación.'); }
  } else if(m === 'queue'){
    if(!S.current) playList([id]); else { S.queue.push(id); renderPlayer(); toast('Agregada a la cola.'); }
  } else if(m === 'addpl'){
    const p = S.playlists.find(p => p.id === b.dataset.p);
    if(p){ if(p.trackIds.includes(id)) toast(`Ya está en «${p.name}».`); else { p.trackIds.push(id); await savePl(p); toast(`Agregada a «${p.name}».`); render(); } }
  } else if(m === 'newpl'){
    const p = {id:uid(), name:'Playlist ' + (S.playlists.length + 1), trackIds:[id], created:Date.now()};
    S.playlists.push(p); await savePl(p); S.view = {type:'playlist', id:p.id}; S.q = ''; $('#q').value = '';
    closeMenu(); render(); toast('Playlist creada. Toca el nombre para cambiarlo.');
    setTimeout(() => { const i = $('#plTitle'); if(i){ i.focus(); i.select(); } }, 0); return;
  } else if(m === 'rmpl'){
    const p = S.playlists.find(p => p.id === S.view.id); if(p){ p.trackIds = p.trackIds.filter(x => x !== id); await savePl(p); render(); }
  } else if(m === 'del'){
    if(S.armed !== 'del:' + id){ S.armed = 'del:' + id; b.classList.add('armed'); b.textContent = '¿Seguro? Toca otra vez para eliminar'; return; }
    await deleteTrack(id); toast(`Eliminé «${t.title}».`);
  }
  closeMenu();
});
async function deleteTrack(id){
  if(S.current === id) stop();
  const t = byId(id);
  S.tracks = S.tracks.filter(x => x.id !== id);
  const qi = S.queue.indexOf(id); if(qi > -1){ S.queue.splice(qi,1); if(qi < S.qi) S.qi--; }
  S.base = S.base.filter(x => x !== id);
  for(const p of S.playlists) if(p.trackIds.includes(id)){ p.trackIds = p.trackIds.filter(x => x !== id); savePl(p); }
  if(urls.has(id)){ URL.revokeObjectURL(urls.get(id)); urls.delete(id); }
  if(covers.has(id)){ URL.revokeObjectURL(covers.get(id)); covers.delete(id); }
  if(t && !t.demo) await del('tracks', id);
  render();
}

/* ---------- Eventos ---------- */
function go(view){ S.view = view; S.armed = null; $('#main').scrollTop = 0; renderNav(); renderView(); }
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.id === 'newPl'){ S.showPlForm = !S.showPlForm; renderNav(); return; }
  if(b.dataset.nav) go({type: b.dataset.nav}); else if(b.dataset.pl) go({type:'playlist', id: b.dataset.pl});
});
$('#nav').addEventListener('submit', async e => {
  e.preventDefault();
  const name = ($('#plName').value || '').trim() || 'Playlist ' + (S.playlists.length + 1);
  const p = {id:uid(), name, trackIds:[], created:Date.now()};
  S.playlists.push(p); await savePl(p); S.showPlForm = false; S.view = {type:'playlist', id:p.id}; render();
});
$('#nav').addEventListener('keydown', e => { if(e.key === 'Escape' && S.showPlForm){ S.showPlForm = false; renderNav(); } });

const albumIds = key => S.tracks.filter(t => albumKey(t) === key).sort((a,b) => (a.trackNo||0)-(b.trackNo||0)).map(t => t.id);
$('#view').addEventListener('click', async e => {
  const more = e.target.closest('.more'); if(more){ e.stopPropagation(); if(!menu.hidden && menu.dataset.id === more.dataset.more) closeMenu(); else openMenu(more); return; }
  const el = e.target.closest('[data-act],[data-nav],[data-album],[data-playalbum],[data-openpl],[data-playpl],[data-playid],[data-c]');
  if(el){
    const d = el.dataset;
    if(d.nav) return go({type:d.nav});
    if(d.album) return go({type:'album', key:d.album});
    if(d.openpl) return go({type:'playlist', id:d.openpl});
    if(d.playalbum){ const ids = albumIds(d.playalbum); return playList(ids, null, byId(ids[0]).album || 'un álbum'); }
    if(d.playpl){ const p = S.playlists.find(p => p.id === d.playpl); return p && playList(p.trackIds.filter(byId), null, p.name); }
    if(d.playid) return playList(S.tracks.map(t => t.id), d.playid, 'tu biblioteca');
    if(d.c === 'open') return openNP();
    const a = d.act, from = S.view.type === 'playlist' ? (S.playlists.find(p => p.id === S.view.id) || {}).name : S.view.type === 'album' ? (viewTracks()[0] || {}).album : 'tu biblioteca';
    if(a === 'playall'){ const was = S.shuffle; S.shuffle = false; playList(viewTracks().map(t => t.id), null, from); S.shuffle = was; renderPlayer(); }
    else if(a === 'shuffleall'){ S.shuffle = true; ls.set('shuffle', true); playList(viewTracks().map(t => t.id), null, from); }
    else if(a === 'shufflelib'){ S.shuffle = true; ls.set('shuffle', true); playList(S.tracks.map(t => t.id), null, 'toda tu música'); }
    else if(a === 'nodemo') removeDemos();
    else if(a === 'delpl'){
      const id = S.view.id;
      if(S.armed !== 'pl:' + id){ S.armed = 'pl:' + id; renderView(); return; }
      S.armed = null; S.playlists = S.playlists.filter(p => p.id !== id); await del('playlists', id);
      S.view = {type:'home'}; render(); toast('Playlist borrada. Las canciones siguen en tu discoteca.');
    }
    return;
  }
  const row = e.target.closest('.row');
  if(row){ const from = S.view.type === 'playlist' ? (S.playlists.find(p => p.id === S.view.id) || {}).name : S.view.type === 'album' ? (byId(row.dataset.id).album || '') : 'tu biblioteca';
    playList(viewTracks().map(t => t.id), row.dataset.id, from); }
});
$('#view').addEventListener('keydown', e => {
  const row = e.target.closest('.row'); if(row && e.target === row && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); row.click(); }
  if(e.target.id === 'plTitle' && e.key === 'Enter') e.target.blur();
});
$('#view').addEventListener('change', async e => {
  if(e.target.classList.contains('pick')){ await addFiles(e.target.files); e.target.value = ''; return; }
  if(e.target.id === 'plTitle'){ const p = S.playlists.find(p => p.id === S.view.id); if(p){ p.name = e.target.value.trim() || p.name; e.target.value = p.name; await savePl(p); renderNav(); } }
});

document.addEventListener('click', e => {
  if(!menu.hidden && !menu.contains(e.target)) closeMenu();
  const c = e.target.closest('[data-c]'); if(!c || c.closest('#view')) return;
  const k = c.dataset.c;
  if(k === 'play') togglePlay();
  else if(k === 'next') next(false);
  else if(k === 'prev') prev();
  else if(k === 'open') openNP();
  else if(k === 'close') closeNP();
  else if(k === 'shuffle'){ S.shuffle = !S.shuffle; ls.set('shuffle', S.shuffle); if(S.current && S.base.length) buildQueue(S.current); renderPlayer(); toast(S.shuffle ? 'Aleatorio activado.' : 'Aleatorio desactivado.'); }
  else if(k === 'repeat'){ S.repeat = ({off:'all', all:'one', one:'off'})[S.repeat]; ls.set('repeat', S.repeat); renderPlayer(); toast(({off:'Repetir desactivado.', all:'Repetir toda la lista.', one:'Repetir esta canción.'})[S.repeat]); }
});
$('#now').addEventListener('click', openNP);
$('#upnext').addEventListener('click', e => { const b = e.target.closest('[data-qjump]'); if(b) playIndex(+b.dataset.qjump); });
$('#main').addEventListener('scroll', closeMenu, {passive:true});
addEventListener('resize', () => { closeMenu(); sizeCanvases(); });

$('#fileIn').addEventListener('change', async e => { await addFiles(e.target.files); e.target.value = ''; });
$('#dirIn').addEventListener('change', async e => { await addFiles(e.target.files); e.target.value = ''; });
let qT; $('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value.trim(); renderView(); }, 120); });

for(const s of $$('.seekIn')){
  s.addEventListener('input', () => { seeking = true; setP(s); const d = audio.duration; if(isFinite(d)) for(const e of $$('.tCur')) e.textContent = fmt(s.value/1000*d); });
  s.addEventListener('change', () => { const d = audio.duration; if(isFinite(d) && S.current) audio.currentTime = s.value/1000*d; seeking = false; });
}
const vol = $('#vol');
function setVol(v){ audio.volume = v/100; vol.value = v; setP(vol); $('#volIc').innerHTML = v == 0 ? I.mute : I.vol; }
vol.addEventListener('input', () => { setVol(+vol.value); ls.set('vol', +vol.value); });

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ if(!menu.hidden) closeMenu(); else if(!$('#np').hidden) closeNP(); }
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
  if(e.code === 'Space' && !e.target.closest('button,.row')){ e.preventDefault(); togglePlay(); }
  else if(e.key === 'ArrowRight' && e.altKey) next(false);
  else if(e.key === 'ArrowLeft' && e.altKey) prev();
});

let dragN = 0; const drop = $('#drop');
const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
addEventListener('dragenter', e => { if(!hasFiles(e)) return; e.preventDefault(); dragN++; drop.hidden = false; });
addEventListener('dragover', e => { if(hasFiles(e)) e.preventDefault(); });
addEventListener('dragleave', e => { if(!hasFiles(e)) return; dragN = Math.max(0, dragN-1); if(!dragN) drop.hidden = true; });
addEventListener('drop', async e => { if(!hasFiles(e)) return; e.preventDefault(); dragN = 0; drop.hidden = true; await addFiles(e.dataTransfer.files); });

let toastT; function toast(msg, ms = 2800){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); if(ms) toastT = setTimeout(() => t.hidden = true, ms); }

/* Instalar como app (solo cuando la página se abre desde su propia dirección) */
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installBtn').hidden = false; });
$('#installBtn').addEventListener('click', async () => { if(!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch(e){} installEvt = null; $('#installBtn').hidden = true; });
addEventListener('appinstalled', () => { $('#installBtn').hidden = true; toast('Mi Discoteca quedó instalada.'); });

/* ---------- Inicio ---------- */
(async function init(){
  S.shuffle = !!ls.get('shuffle', false); S.repeat = ls.get('repeat', 'off'); if(!['off','all','one'].includes(S.repeat)) S.repeat = 'off';
  setVol(ls.get('vol', 80));
  db = await openDB();
  const [tr, pl] = await Promise.all([getAll('tracks'), getAll('playlists')]);
  S.tracks = (tr || []).filter(t => t && t.blob).sort(sortLib);
  S.playlists = (pl || []).sort((a,b) => (a.created||0) - (b.created||0));
  if(!S.tracks.length && !ls.get('demosHidden', false)){
    S.tracks = makeDemos();
    if(!S.playlists.length) S.playlists = [{id:'demo-pl', name:'Para el camino', trackIds:['demo-2','demo-0','demo-4','demo-3'], created:0, demo:true}];
  }
  render();
  const first = S.tracks.slice().sort((a,b) => (b.added||0) - (a.added||0))[0];
  if(first){ dominant(coverSrc(first)).then(c => { if(c && !S.current) document.documentElement.style.setProperty('--dyn', c.join(' ')); }); }
  requestAnimationFrame(drawViz);
})();
})();
</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
